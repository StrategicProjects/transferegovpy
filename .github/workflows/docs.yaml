name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      # The home and changelog pages are the README and CHANGELOG. Copying them
      # here rather than symlinking keeps the checkout portable.
      - name: Refresh copied pages
        run: |
          cp README.md docs/index.md
          cp CHANGELOG.md docs/changelog.md

      - name: Build and deploy
        run: mkdocs gh-deploy --force --clean
