[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "transferegovpy"
version = "0.1.1"
description = "Access the TransfereGov open data APIs from Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    { name = "André Leite", email = "leite@castlab.org" },
    { name = "Hugo Vasconcelos", email = "hugo.vasconcelos@ufpe.br" },
    { name = "Diogo Bezerra", email = "diogo.bezerra@ufpe.br" },
    { name = "Marcos Wasiliew", email = "marcos.wasilew@gmail.com" },
    { name = "Carlos Amorim", email = "carlos.agaf@ufpe.br" },
    { name = "Júlia Nascimento Barreto", email = "juliabarreto@gd.seplag.pe.gov.br" },
]
keywords = [
    "TransfereGov",
    "Brazil",
    "public-finance",
    "parliamentary-amendments",
    "open-data",
    "PostgREST",
    "pandas",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.25",
    "pandas>=1.3",
]

[project.optional-dependencies]
progress = ["tqdm>=4.60"]
dev = ["pytest>=7", "responses>=0.23", "ruff>=0.1", "tqdm>=4.60"]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]

[project.urls]
Homepage = "https://github.com/StrategicProjects/transferegovpy"
Documentation = "https://strategicprojects.github.io/transferegovpy/"
Repository = "https://github.com/StrategicProjects/transferegovpy"
Issues = "https://github.com/StrategicProjects/transferegovpy/issues"
"R sibling" = "https://strategicprojects.github.io/transferegovr/"

[tool.hatch.build.targets.wheel]
packages = ["src/transferegovpy"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
