site_name: transferegovpy
site_description: Access the TransfereGov open data APIs from Python
site_url: https://strategicprojects.github.io/transferegovpy/
repo_url: https://github.com/StrategicProjects/transferegovpy
edit_uri: ""

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

nav:
  - Home: index.md
  - Guides:
      - Collecting large tables safely: pagination.md
      - Putting the tables back together: joining-tables.md
  - Reference: reference.md
  - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            heading_level: 3
            members_order: source

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

extra_css:
  - extra.css
